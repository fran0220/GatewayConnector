name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux behavior gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libdbus-1-dev libfontconfig1-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p gateway-connector-app --features gpui-app

  desktop-compile:
    name: ${{ matrix.name }} GPUI compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.97
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          rustup default 1.97.0
      - run: cargo test -p gateway-connector-core
      - name: Native Windows all-feature clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p gateway-connector-app --features gpui-app
