name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS authoritative gate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.97
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
      - run: cargo fmt --all -- --check
      - name: Full native workspace tests
        run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p gateway-connector-app --features gpui-app
      - name: Stage unsigned macOS release package
        run: ./packaging/macos/stage-release.sh
      - name: Assert macOS bundle and package contract
        run: ./packaging/macos/assert-release.sh

  windows:
    name: Windows native and release gate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.97
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy
          rustup default 1.97.0
      - run: cargo test -p gateway-connector-core
      - name: Native isolated-layout tests
        run: cargo test -p gateway-connector-app --lib
      - name: Native Windows catalog path tests
        run: cargo test -p gateway-connector-backend --lib
      - name: Native Windows all-feature clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p gateway-connector-app --features gpui-app
      - name: Stage unsigned Windows release package
        shell: pwsh
        run: ./packaging/windows/stage-release.ps1
      - name: Assert Windows PE resources and package contract
        shell: pwsh
        run: ./packaging/windows/test-release-assertions.ps1
